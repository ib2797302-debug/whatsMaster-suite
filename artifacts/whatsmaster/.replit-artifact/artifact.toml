kind = "web"
previewPath = "/"
title = "WhatsMaster Suite"
version = "1.0.0"
id = "artifacts/whatsmaster"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18354

[services.development]
run = "pnpm --filter @workspace/whatsmaster run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whatsmaster", "run", "build" ]
publicDir = "artifacts/whatsmaster/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18354"
BASE_PATH = "/"

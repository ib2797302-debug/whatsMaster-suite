/**
 * Configuration Redis pour WhatsMaster Suite
 * Optimisé pour le cache et les files d'attente
 */

# Mémoire maximale (ajuster selon les besoins)
maxmemory 2gb

# Politique d'éviction : garder les données fréquemment utilisées
maxmemory-policy allkeys-lru

# Persistance AOF pour la durabilité
appendonly yes
appendfsync everysec

# Sauvegarde RDB périodique
save 900 1
save 300 10
save 60 10000

# Logs
loglevel notice

# Sécurité (décommenter en production avec un mot de passe fort)
# requirepass your-secure-redis-password-here

# Bind to all interfaces in Docker network
bind 0.0.0.0

# Port
port 6379

# Protection contre les attaques DoS
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Performance
io-threads 4
io-threads-do-reads yes
